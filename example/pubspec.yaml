name: flutter_qcsdk_example
description: "Demonstrates how to use the flutter_qcsdk plugin."
publish_to: 'none'

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter

  flutter_qcsdk:
    path: ../

  permission_handler: ^11.3.1

  cupertino_icons: ^1.0.8

dev_dependencies:
  integration_test:
    sdk: flutter
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
